name: Publish to npm

on:
  push:
    branches: [release]

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  publish:
    name: Publish @richardmcquiston01/html-to-lvgl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # The font-conversion test needs a real TTF; without one it skips
      - name: Install a test typeface
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - run: npm ci

      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD keeps `npm ci` from fetching this on
      # its own; extract.test.mjs needs a real Chromium to launch.
      - run: npx playwright install --with-deps chromium

      - run: npm test

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
