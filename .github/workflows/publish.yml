name: Publish to npm

on:
  push:
    branches: [release]

permissions:
  contents: read

# Overlapping runs (e.g. two quick pushes to release) must not publish out of
# order or race on the same version; queue them instead of running in parallel.
concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  publish:
    name: Publish @richardmcquiston01/html-to-lvgl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install a test typeface
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - run: npm ci

      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD keeps `npm ci` from fetching this on
      # its own; several tests need a real Chromium to launch.
      - run: npx playwright install --with-deps chromium

      - run: npm test

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
