name: Publish to npm

# Publishing runs when a version tag (e.g. 0.3.0 or v0.3.0) is pushed. The
# first job step refuses tags whose commit is not on main.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

# Overlapping runs (e.g. two quick tag pushes) must not publish out of
# order or race on the same version; queue them instead of running in parallel.
concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  publish:
    name: Publish @richardmcquiston01/html-to-lvgl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history so the tag's commit can be checked against main.
          fetch-depth: 0

      - name: Require the tag to point at a commit on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to publish."
            exit 1
          fi

      - name: Require the tag to match package.json version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $package_version."
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install a test typeface
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - run: npm ci

      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD keeps `npm ci` from fetching this on
      # its own; several tests need a real Chromium to launch.
      - run: npx playwright install --with-deps chromium

      - run: npm test

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
