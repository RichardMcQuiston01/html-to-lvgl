name: Publish plugin packages to npm

# Publishes ONE plugin package per tag:
#   vue-v0.1.0  -> @richardmcquiston01/html-to-lvgl-vue  (packages/vue)
#   mui-v0.1.0  -> @richardmcquiston01/html-to-lvgl-mui  (packages/mui)
# The core (plain 0.8.0 or v0.8.0 tags) is published only by publish.yml. The
# tag patterns here cannot match those, and publish.yml's cannot match these.
#
# Run it by hand (Actions -> Run workflow) for a dry run of any package,
# including the core: everything runs up to `npm publish --dry-run`. A manual
# run never publishes.
on:
  push:
    tags:
      - 'vue-v[0-9]+.[0-9]+.[0-9]+'
      - 'mui-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      package:
        description: Package to check
        type: choice
        options: [vue, mui, core]
        default: vue
      dryRun:
        description: Dry run (the only mode a manual run supports)
        type: boolean
        default: true

permissions:
  contents: read

# Shares publish.yml's group name, so a core publish and a plugin publish can
# never run at the same time (the plugin check reads the core's npm version).
concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  publish:
    name: Publish plugin package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history so the tag's commit can be checked against main.
          fetch-depth: 0

      - name: Refuse a real publish from a manual run
        if: github.event_name == 'workflow_dispatch' && !inputs.dryRun
        run: |
          echo "::error::Manual runs are dry runs only. Publish by pushing a vue-vX.Y.Z or mui-vX.Y.Z tag."
          exit 1

      - name: Choose the package
        id: pkg
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            case "$GITHUB_REF_NAME" in
              vue-v*) key=vue ;;
              mui-v*) key=mui ;;
              *) echo "::error::Tag $GITHUB_REF_NAME is not a plugin package tag."; exit 1 ;;
            esac
          else
            key="$INPUT_PACKAGE"
          fi
          case "$key" in
            vue) dir=packages/vue ;;
            mui) dir=packages/mui ;;
            core) dir=. ;;
            *) echo "::error::Unknown package $key."; exit 1 ;;
          esac
          name="$(node -p "require('./$dir/package.json').name")"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Package: $name ($dir)"

      - name: Require the tag to point at a commit on main
        if: github.event_name == 'push'
        run: |
          # fetch-depth: 0 above already fetched origin/main; the checkout step
          # does not persist credentials, so a second `git fetch` would fail.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main; refusing to publish."
            exit 1
          fi

      - name: Require the tag to match the package's package.json version
        if: github.event_name == 'push'
        env:
          PKG_DIR: ${{ steps.pkg.outputs.dir }}
          PKG_KEY: ${{ steps.pkg.outputs.key }}
        run: |
          tag_version="${GITHUB_REF_NAME#"$PKG_KEY"-v}"
          package_version="$(node -p "require('./$PKG_DIR/package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PKG_DIR/package.json version $package_version."
            exit 1
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # Public access for scoped names, and a core peer range that is neither
      # below what the plugin needs nor ahead of the core published on npm.
      - name: Check publish settings and the core peer range
        run: node scripts/check-publish.mjs "${{ steps.pkg.outputs.dir }}"

      - name: Install a test typeface
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation

      - run: npm ci

      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD keeps `npm ci` from fetching this on
      # its own; several tests need a real Chromium to launch.
      - run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch'
        env:
          PKG_NAME: ${{ steps.pkg.outputs.name }}
          PKG_KEY: ${{ steps.pkg.outputs.key }}
        run: |
          if [ "$PKG_KEY" = core ]; then npm publish --dry-run; else npm publish -w "$PKG_NAME" --dry-run; fi

      - name: Publish
        if: github.event_name == 'push'
        run: npm publish -w "${{ steps.pkg.outputs.name }}" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
