name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    name: Unit and golden-file tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The font-conversion test needs a real TTF; without one it skips
      - name: Install a test typeface
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - run: npm ci
      # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD keeps `npm ci` from fetching this on
      # its own; extract.test.mjs needs a real Chromium to launch.
      - run: npx playwright install --with-deps chromium
      - run: npm test

  validate-xml:
    name: Validate golden XML against LVGL v9.4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache LVGL checkout
        id: lvgl-cache
        uses: actions/cache@v4
        with:
          path: lvgl
          key: lvgl-v9.4.0

      - name: Clone LVGL v9.4.0
        if: steps.lvgl-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch v9.4.0 https://github.com/lvgl/lvgl.git lvgl

      - name: Build render harness
        run: |
          cmake -S spike/render -B build -DLVGL_DIR="$GITHUB_WORKSPACE/lvgl" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"

      - name: Render every golden XML through the lv_xml runtime
        run: |
          for xml in tests/golden/*.xml; do
            echo "validating $xml"
            ./build/render "$xml" /tmp/out.bmp
          done

      - name: Render componentized React goldens (multi-file registration)
        run: |
          for dir in tests/golden-react/*/; do
            name=$(basename "$dir")
            components=$(ls "$dir"*.xml | grep -v "/$name\.xml$")
            echo "validating $dir ($name + components)"
            ./build/render "$dir$name.xml" /tmp/out.bmp $components
          done

      - name: Render multi-screen goldens and exercise navigation
        run: |
          for xml in tests/golden-nav/*.xml; do
            siblings=$(ls tests/golden-nav/*.xml | grep -v "^$xml$")
            echo "validating $xml"
            ./build/render "$xml" /tmp/out.bmp $siblings
          done
          # Clicking the generated link must actually load the other screen
          ./build/render tests/golden-nav/home.xml /tmp/out.bmp \
            tests/golden-nav/settings.xml --click=to_settings | tee /tmp/nav.log
          grep -q 'active screen is `settings`' /tmp/nav.log

      - name: Install Node (for lv_font_conv, an npm-distributed tool)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Convert fonts with lv_font_conv and render with them
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-liberation
          L=/usr/share/fonts/truetype/liberation
          # Fixtures are browser-free, so the whole font path runs here
          node scripts/convert-fixture.mjs tests/fixtures/typography.json /tmp/fonts-demo \
            --font-map "Liberation Sans=$L/LiberationSans-Regular.ttf" \
            --font-map "Liberation Sans:700=$L/LiberationSans-Bold.ttf"
          test -n "$(ls /tmp/fonts-demo/fonts/*.bin)" || { echo "no fonts generated"; exit 1; }
          # The generated XML must reference the converted fonts, not Montserrat
          grep -q 'style_text_font="liberation_sans_700_28"' /tmp/fonts-demo/typography.xml
          FONTS=""
          for f in /tmp/fonts-demo/fonts/*.bin; do
            FONTS="$FONTS --font=$(basename "$f" .bin)=$f"
          done
          ./build/render /tmp/fonts-demo/typography.xml /tmp/out.bmp $FONTS

      - name: Compile and render every golden C file against plain LVGL
        run: |
          for c in tests/golden-c/*.c; do
            # ui_nav_home.c/ui_nav_settings.c reference each other's entry
            # point for real navigation now, so they can't link standalone —
            # the next step compiles that pair together instead.
            case "$(basename "$c")" in ui_nav_*.c) continue ;; esac
            # Each unit declares its own entry point (ui_create, or
            # ui_<screen>_create for a screen); read it from the header.
            symbol=$(grep -oE 'ui_[a-z0-9_]+\(lv_obj_t' "${c%.c}.h" | grep -oE 'ui_[a-z0-9_]+')
            echo "validating $c (entry: $symbol)"
            gcc -O1 -o /tmp/render_c \
              -DLV_CONF_PATH="\"$GITHUB_WORKSPACE/spike/render/lv_conf.h\"" \
              -DUI_CREATE_SYMBOL="$symbol" \
              -I "$GITHUB_WORKSPACE/lvgl" -I tests/golden-c \
              spike/render/main_c.c "$c" \
              build/lvgl/lib/liblvgl.a build/lvgl/lib/liblvgl_thorvg.a -lm -lpthread
            /tmp/render_c /tmp/out.bmp
          done

      - name: Compile and link the multi-screen C goldens together and exercise navigation
        run: |
          # ui_nav_home.c's button callback calls ui_settings_create and vice
          # versa (see emit-c.mjs's screen_create_event handling), so proving
          # the generated navigation callback actually links means building
          # both screens into one binary rather than one file at a time.
          gcc -O1 -o /tmp/render_c_nav \
            -DLV_CONF_PATH="\"$GITHUB_WORKSPACE/spike/render/lv_conf.h\"" \
            -DUI_CREATE_SYMBOL=ui_home_create \
            -I "$GITHUB_WORKSPACE/lvgl" -I tests/golden-c \
            spike/render/main_c.c tests/golden-c/ui_nav_home.c tests/golden-c/ui_nav_settings.c \
            build/lvgl/lib/liblvgl.a build/lvgl/lib/liblvgl_thorvg.a -lm -lpthread
          /tmp/render_c_nav /tmp/out.bmp

      - name: Compile and render every golden C++ file against plain LVGL
        run: |
          # main_c.c is dual-mode: compiling it with g++ (instead of gcc) proves
          # --format cpp output links correctly, including against the always-C
          # lv_font_conv font files below.
          for cpp in tests/golden-cpp/*.cpp; do
            case "$(basename "$cpp")" in ui_nav_*.cpp) continue ;; esac
            symbol=$(grep -oE 'ui_[a-z0-9_]+\(lv_obj_t' "${cpp%.cpp}.hpp" | grep -oE 'ui_[a-z0-9_]+')
            echo "validating $cpp (entry: $symbol)"
            g++ -std=c++17 -O1 -o /tmp/render_cpp \
              -DLV_CONF_PATH="\"$GITHUB_WORKSPACE/spike/render/lv_conf.h\"" \
              -DUI_CREATE_SYMBOL="$symbol" \
              -I "$GITHUB_WORKSPACE/lvgl" -I tests/golden-cpp \
              spike/render/main_c.c "$cpp" \
              build/lvgl/lib/liblvgl.a build/lvgl/lib/liblvgl_thorvg.a -lm -lpthread
            /tmp/render_cpp /tmp/out.bmp
          done

      - name: Compile and link the multi-screen C++ goldens together and exercise navigation
        run: |
          g++ -std=c++17 -O1 -o /tmp/render_cpp_nav \
            -DLV_CONF_PATH="\"$GITHUB_WORKSPACE/spike/render/lv_conf.h\"" \
            -DUI_CREATE_SYMBOL=ui_home_create \
            -I "$GITHUB_WORKSPACE/lvgl" -I tests/golden-cpp \
            spike/render/main_c.c tests/golden-cpp/ui_nav_home.cpp tests/golden-cpp/ui_nav_settings.cpp \
            build/lvgl/lib/liblvgl.a build/lvgl/lib/liblvgl_thorvg.a -lm -lpthread
          /tmp/render_cpp_nav /tmp/out.bmp

      - name: Convert with custom fonts as C++ and link against the C-compiled font files
        run: |
          # Proves the C++/C linkage trap fix: a C-compiled lv_font_conv font
          # file must link into a C++ translation unit that references it.
          L=/usr/share/fonts/truetype/liberation
          node scripts/convert-fixture.mjs tests/fixtures/typography.json /tmp/cpp-fonts-demo \
            --font-map "Liberation Sans=$L/LiberationSans-Regular.ttf" \
            --font-map "Liberation Sans:700=$L/LiberationSans-Bold.ttf" \
            --format cpp
          grep -q 'extern "C" const lv_font_t liberation_sans_700_28' /tmp/cpp-fonts-demo/ui_typography.cpp
          mkdir -p /tmp/cpp-font-objs
          for f in /tmp/cpp-fonts-demo/fonts/*.c; do
            gcc -O1 -c -DLV_CONF_PATH="\"$GITHUB_WORKSPACE/spike/render/lv_conf.h\"" \
              -I "$GITHUB_WORKSPACE/lvgl" -o "/tmp/cpp-font-objs/$(basename "${f%.c}.o")" "$f"
          done
          g++ -std=c++17 -O1 -o /tmp/render_cpp_fonts \
            -DLV_CONF_PATH="\"$GITHUB_WORKSPACE/spike/render/lv_conf.h\"" \
            -I "$GITHUB_WORKSPACE/lvgl" -I /tmp/cpp-fonts-demo \
            spike/render/main_c.c /tmp/cpp-fonts-demo/ui_typography.cpp /tmp/cpp-font-objs/*.o \
            build/lvgl/lib/liblvgl.a build/lvgl/lib/liblvgl_thorvg.a -lm -lpthread
          /tmp/render_cpp_fonts /tmp/out.bmp

  validate-micropython-xml:
    name: Validate golden XML on MicroPython (lv_binding_micropython)
    runs-on: ubuntu-latest
    env:
      # Pinned for reproducibility: lv_micropython's tracked submodule
      # pointer for user_modules/lv_binding_micropython moves on nearly
      # every commit ("chore: update micropython binding"). Re-check
      # periodically whether a newer commit's vendored LVGL has picked up
      # v9.4.0 features this project relies on — see "Known limitations"
      # in spike/micropython/README.md.
      LV_MICROPYTHON_COMMIT: 44aa2b153dd3aa1ba183d05bd867fe3ffe2a1d75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Cache lv_micropython checkout (with submodules, unpatched)
        id: lv-micropython-cache
        uses: actions/cache@v4
        with:
          path: lv_micropython
          key: lv-micropython-${{ env.LV_MICROPYTHON_COMMIT }}

      - name: Clone lv_micropython and its submodules
        if: steps.lv-micropython-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/lvgl/lv_micropython.git lv_micropython
          cd lv_micropython
          git checkout "$LV_MICROPYTHON_COMMIT"
          git submodule update --init --depth 1 user_modules/lv_binding_micropython \
            lib/micropython-lib lib/berkeley-db-1.xx lib/libffi lib/axtls lib/mbedtls
          cd user_modules/lv_binding_micropython
          git submodule update --init --depth 1 lvgl pycparser

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev libffi-dev pkg-config libsdl2-2.0-0 libsdl2-dev

      # Idempotent: actions/cache saves whatever is on disk at job end, which
      # is *after* this step has already patched it in place, and cache
      # entries from the default branch are visible to every other branch's
      # runs. So a "cache hit" here can restore an already-patched tree (the
      # exact patch this step is about to apply) just as easily as a fresh,
      # unpatched clone - apply each patch only if it isn't already in.
      - name: Apply the vendored LVGL / binding config patches
        run: |
          apply_if_needed() {
            local patch="$1" dir="$2"
            if git -C "$dir" apply --check "$GITHUB_WORKSPACE/$patch" 2>/dev/null; then
              git -C "$dir" apply "$GITHUB_WORKSPACE/$patch"
            elif git -C "$dir" apply --reverse --check "$GITHUB_WORKSPACE/$patch" 2>/dev/null; then
              echo "$patch already applied (cached checkout) - skipping"
            else
              echo "::error::$patch does not apply cleanly and isn't already applied to $dir"
              exit 1
            fi
          }
          apply_if_needed spike/micropython/patches/lv_binding_micropython-lv_conf.patch \
            lv_micropython/user_modules/lv_binding_micropython
          apply_if_needed spike/micropython/patches/lvgl-binfont-and-xml-event-cb.patch \
            lv_micropython/user_modules/lv_binding_micropython/lvgl

      - name: Build mpy-cross and the unix port (VARIANT=lvgl)
        run: |
          make -C lv_micropython/mpy-cross -j"$(nproc)"
          make -C lv_micropython/ports/unix submodules
          make -C lv_micropython/ports/unix VARIANT=lvgl -j"$(nproc)"

      - name: Render every single-file golden XML
        run: |
          MP="$GITHUB_WORKSPACE/lv_micropython/ports/unix/build-lvgl/micropython"
          for xml in tests/golden/*.xml; do
            # monitor.xml: an lv_table as a grid child segfaults in lv_grid.c
            # on the pinned binding's vendored LVGL (v9.3-era) — a real
            # upstream layout bug fixed by v9.4.0, which validate-xml above
            # already renders this same file against successfully. Not an
            # html2lvgl output problem; see "Known limitations" in
            # spike/micropython/README.md.
            case "$(basename "$xml")" in monitor.xml) continue ;; esac
            echo "validating $xml"
            "$MP" spike/micropython/render_xml.py "$xml" /tmp/out.bmp
          done

      - name: Render componentized React goldens (multi-file registration)
        run: |
          MP="$GITHUB_WORKSPACE/lv_micropython/ports/unix/build-lvgl/micropython"
          for dir in tests/golden-react/*/; do
            name=$(basename "$dir")
            components=$(ls "$dir"*.xml | grep -v "/$name\.xml$")
            echo "validating $dir ($name + components)"
            "$MP" spike/micropython/render_xml.py "$dir$name.xml" /tmp/out.bmp $components
          done

      - name: Render multi-screen goldens
        run: |
          # Each screen instantiates and renders standalone here. Unlike
          # validate-xml's C harness run, this doesn't exercise --click
          # navigation: <screen_create_event> is an LVGL XML construct added
          # after v9.3, so it's not present in the pinned binding's vendored
          # LVGL — see "Known limitations" in spike/micropython/README.md.
          MP="$GITHUB_WORKSPACE/lv_micropython/ports/unix/build-lvgl/micropython"
          for xml in tests/golden-nav/*.xml; do
            siblings=$(ls tests/golden-nav/*.xml | grep -v "^$xml$")
            echo "validating $xml"
            "$MP" spike/micropython/render_xml.py "$xml" /tmp/out.bmp $siblings
          done

      - name: Install Node (for lv_font_conv, an npm-distributed tool)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Convert fonts with lv_font_conv and render with them
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-liberation
          L=/usr/share/fonts/truetype/liberation
          node scripts/convert-fixture.mjs tests/fixtures/typography.json /tmp/fonts-demo \
            --font-map "Liberation Sans=$L/LiberationSans-Regular.ttf" \
            --font-map "Liberation Sans:700=$L/LiberationSans-Bold.ttf"
          MP="$GITHUB_WORKSPACE/lv_micropython/ports/unix/build-lvgl/micropython"
          FONTS=""
          for f in /tmp/fonts-demo/fonts/*.bin; do
            FONTS="$FONTS --font=$(basename "$f" .bin)=$f"
          done
          "$MP" spike/micropython/render_xml.py /tmp/fonts-demo/typography.xml /tmp/out.bmp $FONTS

      - name: Render every golden --format py output by calling ui_create() directly
        run: |
          # Unlike the XML goldens above, monitor.py is *not* excluded here:
          # the known lv_table-as-grid-child memory corruption in this
          # binding's vendored LVGL (see spike/micropython/README.md) doesn't
          # reproduce through the emitter's direct imperative call sequence,
          # only through lv_xml_create()'s own tree-building order — verified
          # by running it repeatedly with no crash, not assumed safe.
          MP="$GITHUB_WORKSPACE/lv_micropython/ports/unix/build-lvgl/micropython"
          for py in tests/golden-py/*.py; do
            case "$(basename "$py")" in ui_nav_*.py) continue ;; esac
            echo "validating $py"
            MICROPYPATH=tests/golden-py "$MP" spike/micropython/run_py.py "$py" ui_create
          done

      - name: Render multi-screen --format py goldens and exercise real cross-module navigation
        run: |
          # The generated nav callback does `import ui_<screen>` (see
          # emit-py.mjs's module doc comment), matching cli.mjs's real
          # multi-screen file naming (ui_<screen>.py) — but the golden
          # directory prefixes these two with nav_ solely to avoid colliding
          # with the standalone settings.json fixture's own golden (same
          # convention tests/golden-c already uses). Stage copies under the
          # real names so the import in the generated code actually resolves.
          mkdir -p /tmp/nav-py
          cp tests/golden-py/ui_nav_home.py /tmp/nav-py/ui_home.py
          cp tests/golden-py/ui_nav_settings.py /tmp/nav-py/ui_settings.py
          MP="$GITHUB_WORKSPACE/lv_micropython/ports/unix/build-lvgl/micropython"
          MICROPYPATH=/tmp/nav-py "$MP" spike/micropython/run_py.py /tmp/nav-py/ui_home.py ui_home_create
          MICROPYPATH=/tmp/nav-py "$MP" spike/micropython/run_py.py /tmp/nav-py/ui_settings.py ui_settings_create
          # child path 2,0: root -> nav (3rd child) -> to_settings (1st child),
          # matching tests/fixtures/home.nav.json's structure.
          MICROPYPATH=/tmp/nav-py "$MP" spike/micropython/run_py_nav.py /tmp/nav-py/ui_home.py ui_home_create 2,0

      - name: Convert fonts with lv_font_conv and render with them (--format py)
        run: |
          L=/usr/share/fonts/truetype/liberation
          node scripts/convert-fixture.mjs tests/fixtures/typography.json /tmp/fonts-demo-py \
            --font-map "Liberation Sans=$L/LiberationSans-Regular.ttf" \
            --font-map "Liberation Sans:700=$L/LiberationSans-Bold.ttf" \
            --format py
          grep -q 'fonts\["liberation_sans_700_28"\]' /tmp/fonts-demo-py/ui_typography.py
          MP="$GITHUB_WORKSPACE/lv_micropython/ports/unix/build-lvgl/micropython"
          FONTS=""
          for f in /tmp/fonts-demo-py/fonts/*.bin; do
            FONTS="$FONTS --font=$(basename "$f" .bin)=$f"
          done
          MICROPYPATH=/tmp/fonts-demo-py "$MP" spike/micropython/run_py.py /tmp/fonts-demo-py/ui_typography.py ui_create $FONTS
