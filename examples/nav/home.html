<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
  body { width: 320px; height: 240px; background-color: #0b1220; overflow: hidden;
         display: flex; flex-direction: column; }
  .bar { height: 34px; background-color: #1d4ed8; color: #ffffff; font-size: 14px;
         display: flex; align-items: center; padding-left: 12px; }
  .readouts { display: flex; gap: 8px; padding: 10px; }
  .tile { flex-grow: 1; height: 70px; border-radius: 8px; background-color: #111c33;
          border: 1px solid #1e3a8a; display: flex; flex-direction: column;
          justify-content: center; align-items: center; gap: 4px; }
  .v { color: #e2e8f0; font-size: 22px; }
  .k { color: #64748b; font-size: 10px; }
  .nav { display: flex; justify-content: center; padding-top: 14px; }
  /* Links to a sibling page become LVGL navigation buttons */
  a { width: 160px; height: 34px; border-radius: 6px; background-color: #2563eb;
      color: #ffffff; font-size: 13px; text-decoration: none;
      display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
  <div class="bar">Home</div>
  <div class="readouts">
    <div class="tile"><div class="v">21.5</div><div class="k">INDOOR C</div></div>
    <div class="tile"><div class="v">64</div><div class="k">HUMIDITY %</div></div>
  </div>
  <div class="nav">
    <a href="settings.html">Settings</a>
  </div>
</body>
</html>
