<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Roboto, Helvetica, Arial, sans-serif; }
  body { width: 320px; height: 240px; background-color: #fafafa; overflow: hidden; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  /* Plain HTML card (Bootstrap-style class) */
  .card { background: #ffffff; border: 1px solid #dee2e6; border-radius: 6px; padding: 8px 12px; }
  .card-title { font-size: 14px; color: #212529; }
  .card-text { font-size: 11px; color: #6c757d; margin-top: 2px; }
  /* Material UI style */
  .row { display: flex; gap: 8px; }
  .MuiPaper-root { background-color: #ffffff; color: rgba(0,0,0,0.87); border-radius: 4px; }
  .MuiPaper-elevation1 { box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.2), 0px 1px 1px 0px rgba(0,0,0,0.14), 0px 1px 3px 0px rgba(0,0,0,0.12); }
  .MuiPaper-elevation3 { box-shadow: 0px 3px 3px -2px rgba(0,0,0,0.2), 0px 3px 4px 0px rgba(0,0,0,0.14), 0px 1px 8px 0px rgba(0,0,0,0.12); }
  .MuiPaper-outlined { border: 1px solid rgba(0,0,0,0.12); }
  .MuiCard-root { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .MuiCardHeader-root { padding: 10px 12px 2px; }
  .MuiCardHeader-title { font-size: 14px; font-weight: 500; }
  .MuiCardContent-root { padding: 2px 12px 6px; font-size: 11px; color: rgba(0,0,0,0.6); }
  .MuiCardActions-root { display: flex; padding: 4px 8px; }
  .MuiCardActions-root button { background: none; border: none; color: #1976d2; font-size: 11px; font-weight: 500; padding: 4px 8px; }
  .paper { padding: 8px 12px; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="card-title">Plain card</div>
    <div class="card-text">Border and 6px radius from CSS</div>
  </div>
  <div class="row">
    <div class="MuiPaper-root MuiPaper-elevation MuiPaper-rounded MuiPaper-elevation3 MuiCard-root">
      <div class="MuiCardHeader-root"><span class="MuiCardHeader-title">Elevated</span></div>
      <div class="MuiCardContent-root">Raised card</div>
      <div class="MuiCardActions-root"><button>SHARE</button><button>MORE</button></div>
    </div>
    <div class="MuiPaper-root MuiPaper-outlined MuiPaper-rounded MuiCard-root">
      <div class="MuiCardHeader-root"><span class="MuiCardHeader-title">Outlined</span></div>
      <div class="MuiCardContent-root">1px border</div>
      <div class="MuiCardActions-root"><button>OPEN</button></div>
    </div>
  </div>
  <div class="MuiPaper-root MuiPaper-elevation MuiPaper-rounded MuiPaper-elevation1 paper">A plain Paper surface</div>
</body>
</html>
