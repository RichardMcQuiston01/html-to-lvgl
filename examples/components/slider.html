<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Slider</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Roboto, Helvetica, Arial, sans-serif; }
  body { width: 320px; height: 240px; background: #ffffff; overflow: hidden; padding: 12px 20px; display: flex; flex-direction: column; gap: 6px; }
  h2 { font-size: 11px; font-weight: 500; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
  .caption { display: flex; justify-content: space-between; font-size: 12px; color: #0f172a; }
  .caption b { font-weight: 500; }

  /* Plain HTML / ARIA version: role="slider" with aria-valuemin / aria-valuemax / aria-valuenow. */
  .range { position: relative; height: 6px; border-radius: 3px; background: #cbd5e1; margin: 10px 0 12px; }
  .range .fill { position: absolute; left: 0; top: 0; height: 6px; width: 65%; border-radius: 3px; background: #0d9488; }
  .range .thumb { position: absolute; left: 65%; top: -5px; width: 16px; height: 16px; margin-left: -8px; border-radius: 8px; background: #0f766e; }

  /* Material UI version: Slider (MUI's own CSS values) with one thumb, then a range slider. */
  .MuiSlider-root { color: #1976d2; display: inline-block; position: relative; box-sizing: content-box; width: 100%; height: 4px; padding: 13px 0; border-radius: 12px; }
  .MuiSlider-rail { display: block; position: absolute; border-radius: inherit; background-color: currentColor; opacity: 0.38; width: 100%; height: inherit; top: 50%; transform: translateY(-50%); }
  .MuiSlider-track { display: block; position: absolute; border-radius: inherit; border: 1px solid currentColor; background-color: currentColor; height: inherit; top: 50%; transform: translateY(-50%); }
  .MuiSlider-thumb { position: absolute; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; background-color: currentColor; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%); top: 50%; }
  .MuiSlider-thumb input { position: absolute; width: 100%; height: 100%; opacity: 0; margin: 0; }
</style>
</head>
<body>
  <h2>Plain ARIA</h2>
  <div class="caption"><span>Volume</span><b>65%</b></div>
  <div class="range" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="65"><div class="fill"></div><div class="thumb"></div></div>
  <h2>Material UI</h2>
  <div class="caption"><span>Brightness</span><b>40</b></div>
  <span class="MuiSlider-root MuiSlider-colorPrimary MuiSlider-sizeMedium"><span class="MuiSlider-rail"></span><span class="MuiSlider-track" style="left:0%;width:40%"></span><span class="MuiSlider-thumb MuiSlider-thumbColorPrimary" data-index="0" style="left:40%"><input data-index="0" aria-valuenow="40" aria-orientation="horizontal" aria-valuemax="100" aria-valuemin="0" type="range" min="0" max="100" step="1" value="40"></span></span>
  <div class="caption"><span>Temperature range</span><b>20 to 70</b></div>
  <span class="MuiSlider-root MuiSlider-colorPrimary MuiSlider-sizeMedium"><span class="MuiSlider-rail"></span><span class="MuiSlider-track" style="left:20%;width:50%"></span><span class="MuiSlider-thumb MuiSlider-thumbColorPrimary" data-index="0" style="left:20%"><input data-index="0" aria-valuenow="20" aria-orientation="horizontal" aria-valuemax="100" aria-valuemin="0" type="range" min="0" max="100" step="1" value="20"></span><span class="MuiSlider-thumb MuiSlider-thumbColorPrimary" data-index="1" style="left:70%"><input data-index="1" aria-valuenow="70" aria-orientation="horizontal" aria-valuemax="100" aria-valuemin="0" type="range" min="0" max="100" step="1" value="70"></span></span>
</body>
</html>
