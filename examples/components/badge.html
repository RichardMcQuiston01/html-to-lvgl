<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Roboto, Helvetica, Arial, sans-serif; }
  body { width: 320px; height: 240px; background: #ffffff; overflow: hidden; padding: 10px; }
  h2 { font-size: 11px; font-weight: 700; color: #616161; margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 22px; margin-bottom: 16px; padding-left: 4px; }
  .anchor { width: 40px; height: 40px; border-radius: 8px; background: #e2e8f0; }
  /* Plain HTML version: a wrapper holding the anchor and a pinned count. */
  .wrap { position: relative; display: inline-flex; }
  .pin { position: absolute; top: -6px; right: -8px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
         background: #dc2626; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .pin.dot { top: -3px; right: -3px; min-width: 10px; width: 10px; height: 10px; padding: 0; border-radius: 5px; background: #16a34a; }
  /* Bootstrap-style inline badge: just a pill label. */
  .badge { display: inline-block; padding: 4px 8px; font-size: 11px; font-weight: 700; color: #fff; background: #6c757d; text-align: center; white-space: nowrap; }
  .rounded-pill { border-radius: 10rem; }
  .bg-primary { background: #0d6efd; }
  /* Material UI version. */
  .MuiBadge-root { position: relative; display: inline-flex; vertical-align: middle; flex-shrink: 0; }
  .MuiBadge-badge { display: flex; flex-flow: row wrap; place-content: center; align-items: center; position: absolute;
    box-sizing: border-box; font-weight: 500; font-size: 12px; min-width: 20px; line-height: 1; padding: 0 6px; height: 20px;
    border-radius: 10px; z-index: 1; background-color: #d32f2f; color: #fff;
    top: 0; right: 0; transform: scale(1) translate(50%, -50%); transform-origin: 100% 0%; }
  .MuiBadge-dot { border-radius: 4px; height: 8px; min-width: 8px; padding: 0; }
  .MuiBadge-colorPrimary { background-color: #1976d2; }
</style>
</head>
<body>
  <h2>Plain HTML</h2>
  <div class="row">
    <span class="wrap" data-lv-widget="badge"><div class="anchor"></div><span class="pin">4</span></span>
    <span class="wrap" data-lv-widget="badge"><div class="anchor"></div><span class="pin dot"></span></span>
    <span class="badge bg-primary rounded-pill">New</span>
    <span class="badge">Beta</span>
  </div>
  <h2>Material UI</h2>
  <div class="row">
    <span class="MuiBadge-root"><div class="anchor"></div><span class="MuiBadge-badge MuiBadge-standard MuiBadge-anchorOriginTopRight">4</span></span>
    <span class="MuiBadge-root"><div class="anchor"></div><span class="MuiBadge-badge MuiBadge-dot MuiBadge-colorPrimary MuiBadge-anchorOriginTopRight"></span></span>
    <span class="MuiBadge-root"><div class="anchor"></div><span class="MuiBadge-badge MuiBadge-standard MuiBadge-anchorOriginTopRight">99+</span></span>
  </div>
</body>
</html>
