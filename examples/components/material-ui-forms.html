<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Material UI forms</title>
<style>
  /* Integration page 1 of 2: a Material UI settings screen that uses an app bar, tabs (the open panel holds a
     text field, a switch row and a slider; two more panels stay hidden), and a bottom navigation together.
     Real MUI class names and roles; hand-written CSS that reproduces their look. */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Roboto, Helvetica, Arial, sans-serif; }
  body { width: 320px; height: 240px; background-color: #fafafa; overflow: hidden; color: rgba(0,0,0,0.87); }

  .MuiPaper-root.MuiAppBar-root { position: fixed; top: 0; left: 0; right: 0; width: 320px; display: flex; flex-direction: column; background-color: #1976d2; color: #fff;
    box-shadow: 0 2px 4px -1px rgba(0,0,0,0.2), 0 4px 5px 0 rgba(0,0,0,0.14), 0 1px 10px 0 rgba(0,0,0,0.12); }
  .MuiToolbar-root { display: flex; align-items: center; position: relative; padding: 0 16px; min-height: 44px; }
  .MuiIconButton-root { width: 32px; height: 32px; margin-left: -8px; margin-right: 12px; padding: 4px; border: 0; border-radius: 50%; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center; }
  .MuiSvgIcon-root { width: 22px; height: 22px; fill: currentColor; }
  .MuiTypography-h6 { flex-grow: 1; font-size: 18px; font-weight: 500; line-height: 1.6; letter-spacing: 0.0075em; }
  .MuiButton-root { border: 0; background: transparent; color: inherit; font-size: 13px; font-weight: 500; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; }
  .spacer { height: 44px; }

  .MuiTabs-root { overflow: hidden; min-height: 34px; display: flex; background: #ffffff; border-bottom: 1px solid rgba(0,0,0,0.12); }
  .MuiTabs-scroller { position: relative; display: inline-block; flex: 1 1 auto; white-space: nowrap; overflow-x: hidden; width: 100%; }
  .MuiTabs-flexContainer { display: flex; }
  .MuiTabs-indicator { position: absolute; height: 2px; bottom: 0; width: 106px; left: 0; background-color: #1976d2; }
  .MuiTab-root { min-width: 90px; min-height: 34px; padding: 6px 12px; flex: 1 1 0; background: transparent; border: 0; color: rgba(0,0,0,0.6); font-size: 12px; font-weight: 500; line-height: 1.25; letter-spacing: 0.02857em; text-transform: uppercase; }
  .MuiTab-root.Mui-selected { color: #1976d2; }
  .MuiTabPanel-root { padding: 8px 14px 0; }
  .MuiTabPanel-root[hidden] { display: none; }

  .MuiFormControl-root { display: inline-flex; flex-direction: column; position: relative; min-width: 0; vertical-align: top; width: 100%; margin-top: 6px; }
  .MuiInputLabel-root { display: block; position: absolute; left: 0; top: 0; transform-origin: top left; transform: translate(12px, 8px) scale(1); font-size: 12px; line-height: 1.4375em; color: rgba(0,0,0,0.6); z-index: 1; pointer-events: none; white-space: nowrap; }
  .MuiInputLabel-shrink { transform: translate(12px, -7px) scale(0.75); }
  .MuiInputBase-root { position: relative; display: inline-flex; align-items: center; border-radius: 4px; font-size: 12px; line-height: 1.4375em; color: rgba(0,0,0,0.87); width: 100%; }
  .MuiInputBase-input { box-sizing: content-box; font: inherit; color: currentColor; width: 100%; border: 0; background: none; height: 1.4375em; padding: 7px 12px; outline: none; }
  .MuiOutlinedInput-notchedOutline { position: absolute; inset: -5px 0 0; margin: 0; padding: 0 8px; border-radius: inherit; border: 1px solid rgba(0,0,0,0.23); pointer-events: none; overflow: hidden; }
  .MuiOutlinedInput-notchedOutline legend { visibility: hidden; font-size: 0.75em; padding: 0; max-width: 100%; height: 11px; white-space: nowrap; }
  .MuiOutlinedInput-notchedOutline legend span { display: inline-block; padding: 0 5px; opacity: 0; visibility: visible; }

  .MuiFormControlLabel-root { display: flex; align-items: center; justify-content: space-between; font-size: 13px; height: 30px; margin-top: 4px; }
  .MuiSwitch-root { display: inline-flex; width: 58px; height: 30px; overflow: hidden; padding: 8px 12px; position: relative; flex-shrink: 0; z-index: 0; margin-right: -12px; }
  .MuiSwitch-switchBase { position: absolute; top: 0; left: 0; z-index: 1; color: #fafafa; padding: 5px; display: inline-flex; }
  .MuiSwitch-switchBase.Mui-checked { transform: translateX(20px); color: #1976d2; }
  .MuiSwitch-input { position: absolute; left: -100%; width: 300%; top: 0; height: 100%; margin: 0; opacity: 0; z-index: 1; }
  .MuiSwitch-thumb { width: 20px; height: 20px; border-radius: 50%; background-color: currentColor; box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.2), 0px 1px 1px 0px rgba(0,0,0,0.14), 0px 1px 3px 0px rgba(0,0,0,0.12); }
  .MuiSwitch-track { height: 100%; width: 100%; border-radius: 7px; z-index: -1; background-color: #000000; opacity: 0.38; }
  .Mui-checked + .MuiSwitch-track { background-color: #1976d2; opacity: 0.5; }

  .caption { display: flex; justify-content: space-between; font-size: 12px; margin-top: 2px; }
  .MuiSlider-root { color: #1976d2; display: inline-block; position: relative; box-sizing: content-box; width: 100%; height: 4px; padding: 10px 0; border-radius: 12px; }
  .MuiSlider-rail { display: block; position: absolute; border-radius: inherit; background-color: currentColor; opacity: 0.38; width: 100%; height: inherit; top: 50%; transform: translateY(-50%); }
  .MuiSlider-track { display: block; position: absolute; border-radius: inherit; border: 1px solid currentColor; background-color: currentColor; height: inherit; top: 50%; transform: translateY(-50%); }
  .MuiSlider-thumb { position: absolute; width: 20px; height: 20px; box-sizing: border-box; border-radius: 50%; background-color: currentColor; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%); top: 50%; }
  .MuiSlider-thumb input { position: absolute; width: 100%; height: 100%; opacity: 0; margin: 0; }

  .MuiBottomNavigation-root { position: fixed; left: 0; right: 0; bottom: 0; height: 48px; display: flex; justify-content: center; background-color: #ffffff; box-shadow: 0 -1px 4px rgba(0,0,0,0.14); }
  .MuiBottomNavigationAction-root { flex: 1 1 0; min-width: 80px; max-width: 168px; padding: 0 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 0; background: transparent; color: rgba(0,0,0,0.6); }
  .MuiBottomNavigationAction-root.Mui-selected { color: #1976d2; }
  .MuiBottomNavigationAction-label { font-size: 11px; margin-top: 1px; }
  .MuiBottomNavigationAction-root .MuiSvgIcon-root { width: 20px; height: 20px; }
</style>
</head>
<body>
  <header class="MuiPaper-root MuiAppBar-root MuiAppBar-colorPrimary MuiAppBar-positionFixed">
    <div class="MuiToolbar-root MuiToolbar-gutters MuiToolbar-regular">
      <button class="MuiIconButton-root" aria-label="menu"><svg class="MuiSvgIcon-root" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
      <h6 class="MuiTypography-root MuiTypography-h6">Settings</h6>
      <button class="MuiButton-root">Save</button>
    </div>
  </header>
  <div class="MuiToolbar-root spacer"></div>

  <div class="MuiTabs-root">
    <div class="MuiTabs-scroller">
      <div class="MuiTabs-flexContainer" role="tablist" aria-label="Settings sections">
        <button class="MuiButtonBase-root MuiTab-root Mui-selected" role="tab" id="set-tab-0" aria-selected="true" aria-controls="set-panel-0">General</button>
        <button class="MuiButtonBase-root MuiTab-root" role="tab" id="set-tab-1" aria-selected="false" aria-controls="set-panel-1" tabindex="-1">Display</button>
        <button class="MuiButtonBase-root MuiTab-root" role="tab" id="set-tab-2" aria-selected="false" aria-controls="set-panel-2" tabindex="-1">About</button>
      </div>
      <span class="MuiTabs-indicator"></span>
    </div>
  </div>

  <div class="MuiTabPanel-root" role="tabpanel" id="set-panel-0" aria-labelledby="set-tab-0">
    <div class="MuiFormControl-root MuiTextField-root">
      <label class="MuiFormLabel-root MuiInputLabel-root MuiInputLabel-shrink MuiInputLabel-outlined" data-shrink="true" for="dev-name" id="dev-name-label">Device name</label>
      <div class="MuiInputBase-root MuiOutlinedInput-root">
        <input aria-invalid="false" id="dev-name" type="text" class="MuiInputBase-input MuiOutlinedInput-input" value="Kitchen panel">
        <fieldset aria-hidden="true" class="MuiOutlinedInput-notchedOutline"><legend><span>Device name</span></legend></fieldset>
      </div>
    </div>
    <label class="MuiFormControlLabel-root">
      <span class="MuiTypography-root MuiFormControlLabel-label">Auto update</span>
      <span class="MuiSwitch-root MuiSwitch-sizeMedium"><span class="MuiSwitch-switchBase MuiSwitch-colorPrimary Mui-checked"><input class="MuiSwitch-input" type="checkbox" role="switch" checked><span class="MuiSwitch-thumb"></span></span><span class="MuiSwitch-track"></span></span>
    </label>
    <div class="caption"><span>Volume</span><b>40</b></div>
    <span class="MuiSlider-root MuiSlider-colorPrimary MuiSlider-sizeMedium"><span class="MuiSlider-rail"></span><span class="MuiSlider-track" style="left:0%;width:40%"></span><span class="MuiSlider-thumb MuiSlider-thumbColorPrimary" data-index="0" style="left:40%"><input data-index="0" aria-valuenow="40" aria-orientation="horizontal" aria-valuemax="100" aria-valuemin="0" type="range" min="0" max="100" step="1" value="40"></span></span>
  </div>
  <div class="MuiTabPanel-root" role="tabpanel" id="set-panel-1" aria-labelledby="set-tab-1" hidden>
    <label class="MuiFormControlLabel-root">
      <span class="MuiTypography-root MuiFormControlLabel-label">Dark mode</span>
      <span class="MuiSwitch-root MuiSwitch-sizeMedium"><span class="MuiSwitch-switchBase MuiSwitch-colorPrimary"><input class="MuiSwitch-input" type="checkbox" role="switch"><span class="MuiSwitch-thumb"></span></span><span class="MuiSwitch-track"></span></span>
    </label>
    <div class="caption"><span>Brightness</span><b>75</b></div>
    <span class="MuiSlider-root MuiSlider-colorPrimary MuiSlider-sizeMedium"><span class="MuiSlider-rail"></span><span class="MuiSlider-track" style="left:0%;width:75%"></span><span class="MuiSlider-thumb MuiSlider-thumbColorPrimary" data-index="0" style="left:75%"><input data-index="0" aria-valuenow="75" aria-orientation="horizontal" aria-valuemax="100" aria-valuemin="0" type="range" min="0" max="100" step="1" value="75"></span></span>
  </div>
  <div class="MuiTabPanel-root" role="tabpanel" id="set-panel-2" aria-labelledby="set-tab-2" hidden>Firmware 2.4.1, built 2026-03-02.</div>

  <nav class="MuiBottomNavigation-root" aria-label="Main">
    <button class="MuiButtonBase-root MuiBottomNavigationAction-root" type="button"><svg class="MuiSvgIcon-root" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span class="MuiBottomNavigationAction-label">Home</span></button>
    <button class="MuiButtonBase-root MuiBottomNavigationAction-root Mui-selected" type="button"><svg class="MuiSvgIcon-root" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3h-4l-.4 3a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 3h4l.4-3a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.4z"/></svg><span class="MuiBottomNavigationAction-label Mui-selected">Settings</span></button>
    <button class="MuiButtonBase-root MuiBottomNavigationAction-root" type="button"><svg class="MuiSvgIcon-root" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg><span class="MuiBottomNavigationAction-label">Nearby</span></button>
  </nav>
</body>
</html>
