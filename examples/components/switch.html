<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Switch</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Roboto, Helvetica, Arial, sans-serif; }
  body { width: 320px; height: 240px; background: #ffffff; overflow: hidden; padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
  h2 { font-size: 11px; font-weight: 500; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
  .row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #0f172a; height: 30px; }
  .row > span { flex: 1; }

  /* Plain HTML / ARIA version: role="switch" and aria-checked carry the state. */
  .sw { position: relative; width: 44px; height: 24px; border: 0; border-radius: 12px; background: #cbd5e1; flex: none; }
  .sw[aria-checked="true"] { background: #2563eb; }
  .sw .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff; }
  .sw[aria-checked="true"] .knob { left: 23px; }
  .sw[disabled] { opacity: 0.5; }

  /* Material UI version: Switch (MUI's own CSS values), inside a FormControlLabel. */
  .MuiFormControlLabel-root { display: flex; align-items: center; gap: 4px; font-size: 13px; color: rgba(0,0,0,0.87); height: 38px; margin-left: -12px; }
  .MuiSwitch-root { display: inline-flex; width: 58px; height: 38px; overflow: hidden; padding: 12px; position: relative; flex-shrink: 0; z-index: 0; vertical-align: middle; }
  .MuiSwitch-switchBase { position: absolute; top: 0; left: 0; z-index: 1; color: #fafafa; padding: 9px; display: inline-flex; }
  .MuiSwitch-switchBase.Mui-checked { transform: translateX(20px); color: #1976d2; }
  .MuiSwitch-input { position: absolute; left: -100%; width: 300%; top: 0; height: 100%; margin: 0; opacity: 0; z-index: 1; }
  .MuiSwitch-thumb { width: 20px; height: 20px; border-radius: 50%; background-color: currentColor;
    box-shadow: 0px 2px 1px -1px rgba(0,0,0,0.2), 0px 1px 1px 0px rgba(0,0,0,0.14), 0px 1px 3px 0px rgba(0,0,0,0.12); }
  .MuiSwitch-track { height: 100%; width: 100%; border-radius: 7px; z-index: -1; background-color: #000000; opacity: 0.38; }
  .Mui-checked + .MuiSwitch-track { background-color: #1976d2; opacity: 0.5; }
</style>
</head>
<body>
  <h2>Plain ARIA</h2>
  <div class="row"><span>Pump enabled</span><button class="sw" role="switch" aria-checked="true" aria-label="Pump enabled"><span class="knob"></span></button></div>
  <div class="row"><span>Night mode</span><button class="sw" role="switch" aria-checked="false" aria-label="Night mode"><span class="knob"></span></button></div>
  <h2>Material UI</h2>
  <label class="MuiFormControlLabel-root">
    <span class="MuiSwitch-root MuiSwitch-sizeMedium"><span class="MuiSwitch-switchBase MuiSwitch-colorPrimary Mui-checked"><input class="MuiSwitch-input" type="checkbox" role="switch" checked><span class="MuiSwitch-thumb"></span></span><span class="MuiSwitch-track"></span></span>
    <span class="MuiTypography-root MuiFormControlLabel-label">Wi-Fi</span>
  </label>
  <label class="MuiFormControlLabel-root">
    <span class="MuiSwitch-root MuiSwitch-sizeMedium"><span class="MuiSwitch-switchBase MuiSwitch-colorPrimary"><input class="MuiSwitch-input" type="checkbox" role="switch"><span class="MuiSwitch-thumb"></span></span><span class="MuiSwitch-track"></span></span>
    <span class="MuiTypography-root MuiFormControlLabel-label">Bluetooth</span>
  </label>
</body>
</html>
