<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Date picker (ARIA)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Roboto, Helvetica, Arial, sans-serif; }
  body { width: 320px; height: 240px; background-color: #ffffff; overflow: hidden;
         display: flex; flex-direction: column; gap: 6px; padding: 8px 16px; }
  input[type=date] { height: 28px; border: 1px solid #9ca3af; border-radius: 4px; padding: 0 8px; font-size: 13px; color: #111827; background: #ffffff; }
  .picker { border: 1px solid #d1d5db; border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 4px; background: #ffffff; }
  .head { display: flex; align-items: center; justify-content: space-between; height: 24px; }
  .head h3 { font-size: 13px; font-weight: 600; color: #111827; }
  .head button { width: 24px; height: 24px; border: 0; border-radius: 12px; background: #f3f4f6; font-size: 14px; color: #374151; }
  [role=grid] { display: flex; flex-direction: column; }
  [role=row] { display: flex; height: 24px; align-items: center; }
  [role=columnheader] { width: 40px; text-align: center; font-size: 11px; color: #6b7280; }
  [role=gridcell] { width: 40px; height: 24px; border: 0; background: transparent; font-size: 12px; color: #111827; text-align: center; }
  .today { border: 1px solid #2563eb; border-radius: 12px; }
  .sel { background: #2563eb; color: #ffffff; border-radius: 12px; }
</style>
</head>
<body>
  <input type="date" value="2026-11-18" aria-label="Date">
  <div class="picker">
    <div class="head">
      <button aria-label="Previous month">&lt;</button>
      <h3 id="cal-title" aria-live="polite">November 2026</h3>
      <button aria-label="Next month">&gt;</button>
    </div>
    <div role="grid" aria-labelledby="cal-title">
      <div role="row"><span role="columnheader" aria-label="Sunday">Su</span><span role="columnheader" aria-label="Monday">Mo</span><span role="columnheader" aria-label="Tuesday">Tu</span><span role="columnheader" aria-label="Wednesday">We</span><span role="columnheader" aria-label="Thursday">Th</span><span role="columnheader" aria-label="Friday">Fr</span><span role="columnheader" aria-label="Saturday">Sa</span></div>
      <div role="row"><button role="gridcell" aria-selected="false" class="day">1</button><button role="gridcell" aria-selected="false" class="day">2</button><button role="gridcell" aria-selected="false" class="day">3</button><button role="gridcell" aria-selected="false" class="day">4</button><button role="gridcell" aria-selected="false" class="day">5</button><button role="gridcell" aria-current="date" aria-selected="false" class="day today">6</button><button role="gridcell" aria-selected="false" class="day">7</button></div>
      <div role="row"><button role="gridcell" aria-selected="false" class="day">8</button><button role="gridcell" aria-selected="false" class="day">9</button><button role="gridcell" aria-selected="false" class="day">10</button><button role="gridcell" aria-selected="false" class="day">11</button><button role="gridcell" aria-selected="false" class="day">12</button><button role="gridcell" aria-selected="false" class="day">13</button><button role="gridcell" aria-selected="false" class="day">14</button></div>
      <div role="row"><button role="gridcell" aria-selected="false" class="day">15</button><button role="gridcell" aria-selected="false" class="day">16</button><button role="gridcell" aria-selected="false" class="day">17</button><button role="gridcell" aria-selected="true" class="day sel">18</button><button role="gridcell" aria-selected="false" class="day">19</button><button role="gridcell" aria-selected="false" class="day">20</button><button role="gridcell" aria-selected="false" class="day">21</button></div>
      <div role="row"><button role="gridcell" aria-selected="false" class="day">22</button><button role="gridcell" aria-selected="false" class="day">23</button><button role="gridcell" aria-selected="false" class="day">24</button><button role="gridcell" aria-selected="false" class="day">25</button><button role="gridcell" aria-selected="false" class="day">26</button><button role="gridcell" aria-selected="false" class="day">27</button><button role="gridcell" aria-selected="false" class="day">28</button></div>
      <div role="row"><button role="gridcell" aria-selected="false" class="day">29</button><button role="gridcell" aria-selected="false" class="day">30</button><span role="gridcell" aria-hidden="true"></span><span role="gridcell" aria-hidden="true"></span><span role="gridcell" aria-hidden="true"></span><span role="gridcell" aria-hidden="true"></span><span role="gridcell" aria-hidden="true"></span></div>
    </div>
  </div>
</body>
</html>
