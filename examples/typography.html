<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Convert with a real typeface instead of the built-in Montserrat:
     node src/cli.mjs examples/typography.html -o out/ \
       --font-map "Liberation Sans=/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf" \
       --font-map "Liberation Sans:700=/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf"
     Each family/weight/size the page uses becomes its own subsetted LVGL font. */
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Liberation Sans", sans-serif; }
  body { width: 320px; height: 240px; background-color: #fdfcfb; overflow: hidden;
         display: flex; flex-direction: column; }
  .bar { height: 34px; background-color: #7c2d12; color: #fff7ed; font-size: 15px;
         font-weight: 700; display: flex; align-items: center; padding-left: 12px; }
  .body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .lead { font-size: 13px; color: #1c1917; }
  .meta { font-size: 11px; color: #78716c; }
  .readout { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
  .value { font-size: 28px; font-weight: 700; color: #7c2d12; }
  .unit { font-size: 12px; color: #78716c; }
  .note { font-size: 11px; color: #a8a29e; margin-top: 6px; }
</style>
</head>
<body>
  <div class="bar">Kiln Controller</div>
  <div class="body">
    <div class="lead">Firing schedule: bisque, cone 04</div>
    <div class="readout">
      <span class="value">1063</span>
      <span class="unit">degrees C</span>
    </div>
    <div class="meta">Segment 3 of 5 — holding for 20 minutes</div>
    <div class="note">Glyphs are subset to the text on this page.</div>
  </div>
</body>
</html>
