<!doctype html>
<html>
<head>
<style>
  body { margin: 0; width: 320px; height: 240px; background: #f1f5f9; position: relative; font-family: sans-serif; }
  #panel { position: absolute; left: 20px; top: 30px; width: 120px; height: 80px; background: #fff; border: 1px solid #cbd5e1; border-radius: 8px; }
  #badge { position: absolute; left: 170px; top: 40px; width: 60px; height: 30px; background: #2563eb; color: #fff; border-radius: 6px; text-align: center; line-height: 30px; font-size: 14px; }
  #corner { position: absolute; right: 10px; bottom: 10px; width: 50px; height: 40px; background: #16a34a; border-radius: 6px; }
  #row { position: absolute; left: 20px; top: 140px; width: 200px; display: flex; gap: 8px; }
  #row div { width: 40px; height: 30px; background: #f59e0b; border-radius: 4px; }
</style>
</head>
<body>
  <div id="panel" data-lv-name="panel"></div>
  <div id="badge" data-lv-name="badge">New</div>
  <div id="corner" data-lv-name="corner"></div>
  <div id="row" data-lv-name="row"><div data-lv-name="chip_a"></div><div data-lv-name="chip_b"></div></div>
</body>
</html>
